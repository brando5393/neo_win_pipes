[package]
name = "pipes-settings"
description = "Standalone settings app: a live pipes preview alongside a settings drawer, reading/writing the same AppConfig the screensaver uses."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "pipes-settings"
path = "src/main.rs"

[dependencies]
pipes-core = { path = "../pipes-core" }
pipes-render = { path = "../pipes-render" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { workspace = true }
serde_json = "1"
semver = "1"
# "async-std" is required by rfd itself for "xdg-portal" (its build.rs
# panics without one of "tokio"/"async-std" — it needs a runtime to
# drive the ashpd calls); picked over "tokio" since it's the lighter
# pairing with zbus's "async-io" backend below, and this project has no
# other reason to pull in a full tokio runtime.
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "async-std"] }
sha2 = "0.10"
# Pure-Rust PDF generation (no external binary/renderer needed) for the
# in-app benchmark report export — see benchmark.rs. default-features
# disabled: this project only needs basic text/vector drawing, not
# printpdf's image-format decoders (png/jpeg/webp/etc.).
printpdf = { version = "0.7", default-features = false }
# RFC3339 timestamp formatting for benchmark reports — much lighter than
# pulling in chrono for one date string.
humantime = "2"

# Not used directly: rfd's "xdg-portal" feature (the native Linux file
# dialog, via ashpd) pulls in zbus without any async-backend feature
# enabled, which fails to compile (missing async_io/async_fs/etc. — a
# known ashpd/zbus feature-unification gap). Declaring zbus here with
# "async-io" explicitly forces Cargo to unify the whole build's zbus
# feature set to include it, fixing the transitive build with no code
# of ours actually calling zbus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_UI_Shell", "Foundation"] }
# Used to open URLs via ShellExecuteW instead of `cmd /c start` - the
# latter re-parses its command tail through cmd.exe's own shell grammar,
# which treats `&` as a command separator and silently truncates any URL
# containing one (every feedback-issue URL does, at its first query
# param). Found by actually clicking through a generated issue link, not
# by reading the code.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
