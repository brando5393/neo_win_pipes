[package]
name = "pipes-settings"
description = "Standalone settings app: a live pipes preview alongside a settings drawer, reading/writing the same AppConfig the screensaver uses."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pipes-settings"
path = "src/main.rs"

[dependencies]
pipes-core = { path = "../pipes-core" }
pipes-render = { path = "../pipes-render" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { workspace = true }
serde_json = "1"
semver = "1"
rfd = { version = "0.14", default-features = false, features = ["xdg-portal"] }

# Not used directly: rfd's "xdg-portal" feature (the native Linux file
# dialog, via ashpd) pulls in zbus without any async-backend feature
# enabled, which fails to compile (missing async_io/async_fs/etc. — a
# known ashpd/zbus feature-unification gap). Declaring zbus here with
# "async-io" explicitly forces Cargo to unify the whole build's zbus
# feature set to include it, fixing the transitive build with no code
# of ours actually calling zbus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", default-features = false, features = ["async-io"] }
