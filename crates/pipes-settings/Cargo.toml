[package]
name = "pipes-settings"
description = "Standalone settings app: a live pipes preview alongside a settings drawer, reading/writing the same AppConfig the screensaver uses."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pipes-settings"
path = "src/main.rs"

[dependencies]
pipes-core = { path = "../pipes-core" }
pipes-render = { path = "../pipes-render" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"
