[package]
name = "pipes-app"
description = "Windowed renderer for pipes-core: turns the simulation into 3D pipe geometry and draws it with wgpu."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pipes-app"
path = "src/main.rs"

[dependencies]
pipes-core = { path = "../pipes-core" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = "0.19"
winit = "0.29"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
glam = "0.27"
