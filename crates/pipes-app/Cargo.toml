[package]
name = "pipes-app"
description = "The actual screensaver: a fullscreen-friendly window that loads AppConfig and renders the pipes simulation via pipes-render."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "pipes-app"
path = "src/main.rs"

[dependencies]
pipes-core = { path = "../pipes-core" }
pipes-render = { path = "../pipes-render" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
